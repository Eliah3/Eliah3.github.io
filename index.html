<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hallo Welt</title>
  <meta name="description" content="Hallo Welt – von Eliah">
  <meta name="theme-color" content="#07060f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
  <style>
    :root {
      --bg: #07060f;
      --fg: #f4f1ff;
      --muted: #9a94b8;
      --a: #7c5cff;
      --b: #00e0ff;
      --c: #ff4fd8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      cursor: default;
    }

    /* Hintergrund: weiche, wandernde Farbflächen */
    .blobs { position: fixed; inset: 0; filter: blur(80px) saturate(140%); opacity: .55; z-index: 0; }
    .blob {
      position: absolute;
      width: 46vmax; height: 46vmax;
      border-radius: 50%;
      mix-blend-mode: screen;
      animation: drift 22s ease-in-out infinite alternate;
    }
    .blob:nth-child(1) { background: var(--a); top: -12vmax; left: -10vmax; }
    .blob:nth-child(2) { background: var(--b); bottom: -16vmax; right: -12vmax; animation-duration: 26s; animation-delay: -6s; }
    .blob:nth-child(3) { background: var(--c); top: 30%; left: 45%; width: 30vmax; height: 30vmax; animation-duration: 18s; animation-delay: -12s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
      50%  { transform: translate(12vw, 8vh) scale(1.15) rotate(40deg); }
      100% { transform: translate(-8vw, 14vh) scale(.9) rotate(-30deg); }
    }

    /* Feines Rauschen + Raster für Tiefe */
    .grid {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
      animation: gridmove 30s linear infinite;
    }
    @keyframes gridmove { to { background-position: 64px 64px, 64px 64px; } }

    canvas { position: fixed; inset: 0; z-index: 2; }

    main {
      position: relative; z-index: 3;
      height: 100%;
      display: grid; place-items: center; align-content: center; gap: 1.6rem;
      text-align: center;
      padding: 2rem;
      pointer-events: none;
    }

    .eyebrow {
      font-size: .8rem; letter-spacing: .5em; text-transform: uppercase;
      color: var(--muted);
      opacity: 0; animation: fadeUp 1s .2s cubic-bezier(.2,.8,.2,1) forwards;
    }

    h1 {
      font-size: clamp(3.5rem, 15vw, 12rem);
      font-weight: 900;
      line-height: .95;
      letter-spacing: -.04em;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .25em;
      pointer-events: auto;
    }
    h1 .word { display: inline-flex; }
    h1 .ch {
      display: inline-block;
      background: linear-gradient(110deg, var(--fg) 0%, var(--b) 30%, var(--a) 50%, var(--c) 70%, var(--fg) 100%);
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      opacity: 0;
      transform: translateY(.6em) rotateX(-90deg);
      transform-origin: 50% 100%;
      animation:
        letterIn .9s cubic-bezier(.2,.9,.25,1.3) forwards,
        shimmer 6s linear infinite;
      animation-delay: calc(.5s + var(--i) * 70ms), calc(var(--i) * -150ms);
      transition: transform .35s cubic-bezier(.2,.9,.25,1.4), filter .35s;
      will-change: transform;
    }
    h1 .ch:hover {
      transform: translateY(-.12em) scale(1.12) rotate(-4deg);
      filter: drop-shadow(0 0 .25em rgba(124, 92, 255, .8));
    }

    @keyframes letterIn {
      to { opacity: 1; transform: translateY(0) rotateX(0); }
    }
    @keyframes shimmer {
      to { background-position: -300% 0; }
    }

    .sub {
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      color: var(--muted);
      min-height: 1.6em;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    .sub .cursor {
      display: inline-block; width: .6ch; height: 1.1em; margin-left: 2px;
      background: var(--b); vertical-align: -.15em;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .hint {
      position: fixed; bottom: 1.6rem; left: 0; right: 0; z-index: 3;
      text-align: center; font-size: .75rem; letter-spacing: .3em; text-transform: uppercase;
      color: var(--muted);
      opacity: 0; animation: fadeUp 1s 2.4s forwards, pulse 3s 3.4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: .8; transform: translateY(0); }
    }
    @keyframes pulse { 50% { opacity: .35; } }

    /* Klick-Welle */
    .ripple {
      position: fixed; z-index: 2; pointer-events: none;
      width: 10px; height: 10px; margin: -5px 0 0 -5px;
      border-radius: 50%;
      border: 2px solid var(--b);
      animation: ripple .9s ease-out forwards;
    }
    @keyframes ripple {
      to { transform: scale(40); opacity: 0; border-width: .5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
      .ch { animation-delay: 0s !important; }
    }
  </style>
</head>
<body>
  <div class="blobs" aria-hidden="true"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
  <div class="grid" aria-hidden="true"></div>
  <canvas id="stars" aria-hidden="true"></canvas>

  <main>
    <p class="eyebrow">eliah3.github.io</p>
    <h1 id="title" aria-label="Hallo Welt">Hallo Welt</h1>
    <p class="sub"><span id="type"></span><span class="cursor" aria-hidden="true"></span></p>
  </main>

  <p class="hint">Bewege die Maus · Klick irgendwo</p>

  <script>
    (() => {
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Überschrift in einzelne Buchstaben zerlegen
      const title = document.getElementById("title");
      let i = 0;
      title.innerHTML = title.textContent.split(" ").map(word =>
        `<span class="word" aria-hidden="true">` +
        [...word].map(ch => `<span class="ch" style="--i:${i++}">${ch}</span>`).join("") +
        `</span>`
      ).join("");

      // Schreibmaschinen-Untertitel
      const lines = [
        "Willkommen auf meiner Seite.",
        "Schön, dass du da bist.",
        "Hier entsteht bald mehr ✨",
      ];
      const typeEl = document.getElementById("type");
      let li = 0, ci = 0, deleting = false;
      function tick() {
        const line = lines[li];
        typeEl.textContent = line.slice(0, ci);
        if (!deleting && ci < line.length) { ci++; setTimeout(tick, 55 + Math.random() * 60); }
        else if (!deleting) { deleting = true; setTimeout(tick, 2200); }
        else if (ci > 0) { ci--; setTimeout(tick, 28); }
        else { deleting = false; li = (li + 1) % lines.length; setTimeout(tick, 400); }
      }
      if (reduced) typeEl.textContent = lines[0];
      else setTimeout(tick, 1600);

      // Partikelfeld, das der Maus folgt
      const canvas = document.getElementById("stars");
      const ctx = canvas.getContext("2d");
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const mouse = { x: -9999, y: -9999 };
      let w, h, particles = [];

      function resize() {
        w = canvas.width = innerWidth * dpr;
        h = canvas.height = innerHeight * dpr;
        canvas.style.width = innerWidth + "px";
        canvas.style.height = innerHeight + "px";
        const count = Math.min(160, Math.floor(innerWidth * innerHeight / 9000));
        particles = Array.from({ length: count }, () => ({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - .5) * .3 * dpr, vy: (Math.random() - .5) * .3 * dpr,
          r: (Math.random() * 1.6 + .4) * dpr,
          hue: [255, 190, 310][Math.floor(Math.random() * 3)],
        }));
      }

      const linkDist = 120 * dpr, mouseDist = 180 * dpr;
      function frame() {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
          const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
          if (d < mouseDist && d > 0) {
            const f = (1 - d / mouseDist) * .6;
            p.vx += dx / d * f; p.vy += dy / d * f;
          }
          p.vx *= .96; p.vy *= .96;
          p.vx += (Math.random() - .5) * .02 * dpr; p.vy += (Math.random() - .5) * .02 * dpr;
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x += w; if (p.x > w) p.x -= w;
          if (p.y < 0) p.y += h; if (p.y > h) p.y -= h;
        }
        for (let a = 0; a < particles.length; a++) {
          const p = particles[a];
          for (let b = a + 1; b < particles.length; b++) {
            const q = particles[b], d = Math.hypot(p.x - q.x, p.y - q.y);
            if (d < linkDist) {
              ctx.strokeStyle = `hsla(${p.hue}, 100%, 70%, ${(1 - d / linkDist) * .25})`;
              ctx.lineWidth = dpr * .6;
              ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
            }
          }
          ctx.fillStyle = `hsla(${p.hue}, 100%, 75%, .9)`;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        if (!reduced) requestAnimationFrame(frame);
      }

      addEventListener("resize", resize);
      addEventListener("pointermove", e => { mouse.x = e.clientX * dpr; mouse.y = e.clientY * dpr; });
      addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; });

      // Klick: Welle + Partikel-Explosion
      addEventListener("pointerdown", e => {
        const r = document.createElement("span");
        r.className = "ripple";
        r.style.left = e.clientX + "px"; r.style.top = e.clientY + "px";
        document.body.appendChild(r);
        r.addEventListener("animationend", () => r.remove());
        const cx = e.clientX * dpr, cy = e.clientY * dpr;
        for (const p of particles) {
          const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) || 1;
          const f = Math.max(0, 1 - d / (400 * dpr)) * 12;
          p.vx += dx / d * f; p.vy += dy / d * f;
        }
      });

      // Leichter 3D-Tilt der Überschrift
      if (!reduced) addEventListener("pointermove", e => {
        const rx = (e.clientY / innerHeight - .5) * -10;
        const ry = (e.clientX / innerWidth - .5) * 14;
        title.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg)`;
      });

      resize();
      frame();
    })();
  </script>
</body>
</html>
